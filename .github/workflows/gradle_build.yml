# Builds Pathadol in the cloud and publishes GitHub Releases directly from Actions.
# - Push to main: updates the rolling `latest` prerelease with fresh JARs & checksums.
# - Push tag `v*` (or run workflow_dispatch with release_tag): creates/updates a numbered release.

name: Build Pathadol

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to publish (e.g. v0.1.2-mc26.3)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'zulu'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Compute version
      id: ver
      env:
        INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        elif [[ -n "$INPUT_RELEASE_TAG" ]]; then
          echo "version=${INPUT_RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
        else
          base="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          echo "version=${base}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        fi

    - name: Build with Gradle
      run: ./gradlew build -Pmod_version="${{ steps.ver.outputs.version }}" --stacktrace

    - name: Upload JARs
      uses: actions/upload-artifact@v7
      with:
        name: pathadol-${{ steps.ver.outputs.version }}
        path: dist/
        if-no-files-found: error

    - name: Upload mappings
      uses: actions/upload-artifact@v7
      with:
        name: mappings-${{ steps.ver.outputs.version }}
        path: mapping/

    - name: Publish tagged release
      if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        TAG="${INPUT_RELEASE_TAG:-$GITHUB_REF_NAME}"
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --title "Pathadol $TAG"
        else
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Pathadol $TAG" \
            --generate-notes
        fi

    - name: Update rolling latest release
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.release_tag == ''
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        SHORT_SHA="$(git rev-parse --short HEAD)"
        NOTES="Rolling build from \`main\` commit \`${SHORT_SHA}\` ([workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))."
        git tag -f latest "$GITHUB_SHA"
        git push origin refs/tags/latest --force
        if gh release view latest >/dev/null 2>&1; then
          for asset in $(gh release view latest --json assets --jq '.assets[].name'); do
            gh release delete-asset latest "$asset" -y
          done
          gh release upload latest dist/* --clobber
          gh release edit latest \
            --title "Pathadol Latest (main-${SHORT_SHA})" \
            --notes "$NOTES" \
            --prerelease
        else
          gh release create latest dist/* \
            --target "$GITHUB_SHA" \
            --title "Pathadol Latest (main-${SHORT_SHA})" \
            --notes "$NOTES" \
            --prerelease
        fi
