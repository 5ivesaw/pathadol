# Builds Pathadol in the cloud. Nothing needs to be built locally.
# Every push uploads the JARs as an artifact; pushing a tag like v0.1.0 also creates a GitHub Release.

name: Build Pathadol

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'zulu'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Compute version
      id: ver
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        else
          base="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          echo "version=${base}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        fi

    - name: Build with Gradle
      run: ./gradlew build -Pmod_version="${{ steps.ver.outputs.version }}" --stacktrace

    - name: Upload JARs
      uses: actions/upload-artifact@v7
      with:
        name: pathadol-${{ steps.ver.outputs.version }}
        path: dist/
        if-no-files-found: error

    - name: Upload mappings
      uses: actions/upload-artifact@v7
      with:
        name: mappings-${{ steps.ver.outputs.version }}
        path: mapping/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" dist/*.jar --title "Pathadol $GITHUB_REF_NAME" --generate-notes
